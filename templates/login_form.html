<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-main: #f4f6f9;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        main {
            width: 100%;
            max-width: 400px;
        }

        .auth-card {
            background-color: var(--bg-card);
            padding: 36px 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header i {
            color: var(--primary);
            width: 36px;
            height: 36px;
            margin-bottom: 12px;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: var(--text-secondary);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px 12px 42px; /* Отступ слева под иконку */
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background-color: #ffffff;
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--primary);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.2);
        }

        button[type="submit"]:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <main>
        <form method="post" action="/login" class="auth-card">
            
            <div class="auth-header">
                <i data-lucide="shield-check"></i>
                <h2>Авторизация</h2>
            </div>

            <div class="form-group">
                <label for="login">Логин</label>
                <div class="input-wrapper">
                    <i data-lucide="user"></i>
                    <input type="text" id="login" name="login" placeholder="Введите логин" required autocomplete="username">
                </div>
            </div>    

            <div class="form-group">
                <label for="passwd">Пароль</label>
                <div class="input-wrapper">
                    <i data-lucide="lock"></i>
                    <input type="password" id="passwd" name="passwd" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit">
                <span>Войти</span>
                <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
            </button>

        </form>
    </main>

    <script>
        // Инициализация иконок Lucide
        lucide.createIcons();
    </script>
</body>
</html>
